[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lakehouse-runledger"
dynamic = ["version"]
description = "Event logging and first-class data validation for Databricks Workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
# Deliberately no runtime dependencies: pyspark is provided by the Databricks runtime and is
# imported lazily only by the Spark-facing modules.
dependencies = []

[project.optional-dependencies]
sdk = ["databricks-sdk>=0.30"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]
spark-test = ["pyspark>=3.5", "delta-spark>=3.2"]

[project.scripts]
runledger = "lakehouse_runledger.cli:main"

[tool.hatch.version]
path = "src/lakehouse_runledger/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse_runledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "spark: needs a local pyspark + delta session (Tier 2)",
  "integration: runs against a live Databricks workspace (Tier 4)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # doc snippets are formatted for reading, not by the formatter

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Spark Connect / serverless safety: these only work on classic JVM-backed sessions.
# The single guarded exception will live in context/providers/runtime.py (per-file ignore).
"py4j".msg = "Not available on Spark Connect / serverless. Use DataFrame/SQL APIs."
"pyspark.SparkContext".msg = "Not available on Spark Connect / serverless."
"pyspark.rdd".msg = "RDDs are not available on Spark Connect / serverless."
